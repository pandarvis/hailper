[project]
name = "hailper"
version = "0.1.0"
description = "Voice assistant for a visually-impaired user"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "faster-whisper>=1.0",
  "sounddevice>=0.4",
  "webrtcvad>=2.0",
  "numpy>=1.24",
  "yt-dlp>=2024.8.0",
  "evdev>=1.6; sys_platform == 'linux'",
  "piper-tts>=1.2; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hailper = "hailper.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
